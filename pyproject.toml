
[project]
name = "ecommerce-recommendation-system"
version = "0.1.0"
description = "Sistema de recomendação de produtos baseado no comportamento de navegação dos usuários utilizando redes neurais."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Cauã Graff" }
]

dependencies = [
    "torch>=2.2.0",            
    "scikit-learn>=1.4.0",     
    "mlflow>=2.11.0",          
    "dvc>=3.45.0",             
    "pandas>=2.2.0",           
    "numpy>=1.26.0",           
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",    
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",           
    "ruff>=0.3.0",             
    "pre-commit>=3.6.0",       
    "ipykernel>=6.29.0",       
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "ANN"] 
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google" 