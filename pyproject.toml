[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-recommendation-system"
version = "0.1.0"
description = "Sistema de recomendação de produtos baseado no comportamento de navegação dos usuários utilizando redes neurais."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Cauã Graff" }
]

dependencies = [
    "torch==2.13.0",
    "mlflow==3.14.0",
    "scikit-learn==1.9.0",
    "numpy==1.26.4",
    "pandas==2.3.3",
    "dvc==3.67.1",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "dvc-gdrive>=3.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",           
    "ruff>=0.3.0",             
    "pre-commit>=3.6.0",       
    "ipykernel>=6.29.0",       
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py312"
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "docs/",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort (import sorting)
    "N",  # pep8-naming
    "T20",  # flake8-print (proíbe print(), usar logging)
    "W",  # pycodestyle warnings
]
extend-ignore = [
    "E203",  # whitespace antes de ':' (conflita com ruff format)
    "E501",  # line too long (delegado ao ruff format)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
"notebooks/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.uv.workspace]
members = [
    "dvc",
]
