services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.0.1
    container_name: recommender-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 10s
      timeout: 5s
      retries: 5

  train:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recommender-train
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./artifacts:/app/artifacts
    entrypoint: ["python"]
    command: ["scripts/train.py"]

volumes:
  mlflow-data:
